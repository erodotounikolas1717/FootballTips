<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Football Tips — History</title>
<style>
body{
  font-family:Arial,sans-serif;
  background:#0b1220;
  color:#fff;
  margin:0;
  padding:24px;
}
.container{
  max-width:1100px;
  margin:auto;
}
h1{
  margin-bottom:6px;
}
.subtitle{
  color:#9aa7bd;
  margin-bottom:24px;
}
.stats{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
.card{
  background:#121c2e;
  border:1px solid #26344d;
  border-radius:12px;
  padding:14px 18px;
  min-width:130px;
}
.card strong{
  display:block;
  font-size:22px;
  margin-top:5px;
}
.filters{
  display:flex;
  gap:10px;
  margin-bottom:16px;
  flex-wrap:wrap;
}
select{
  background:#121c2e;
  color:#fff;
  border:1px solid #26344d;
  border-radius:8px;
  padding:9px 12px;
}
.table-wrap{
  overflow-x:auto;
  background:#121c2e;
  border-radius:12px;
  border:1px solid #26344d;
}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:13px 12px;
  text-align:left;
  border-bottom:1px solid #26344d;
  white-space:nowrap;
}
th{
  color:#9aa7bd;
  font-size:13px;
}
.win{
  color:#5ee28a;
  font-weight:700;
  font-size:20px;
}
.loss{
  color:#ff6b6b;
  font-weight:700;
  font-size:20px;
}
.pending{
  color:#f6c85f;
  font-weight:700;
  font-size:18px;
}
.empty{
  text-align:center;
  color:#9aa7bd;
  padding:30px;
}
</style>
</head>

<body>
<div class="container">

<h1>⚽ Football Tips — History</h1>
<div class="subtitle">Automatic results & performance history</div>

<div class="stats">
  <div class="card">Total<strong id="total">0</strong></div>
  <div class="card">Wins<strong id="wins">0</strong></div>
  <div class="card">Losses<strong id="losses">0</strong></div>
  <div class="card">Pending<strong id="pending">0</strong></div>
  <div class="card">Win Rate<strong id="rate">0%</strong></div>
</div>

<div class="filters">
  <select id="status">
    <option value="ALL">All</option>
    <option value="PENDING">Pending</option>
    <option value="WIN">Wins</option>
    <option value="LOSS">Losses</option>
  </select>

  <select id="market">
    <option value="ALL">All Markets</option>
    <option value="OVER 2.5">OVER 2.5</option>
    <option value="OVER 3.5">OVER 3.5</option>
    <option value="GG">GG</option>
    <option value="OVER 2.5 + GG">OVER 2.5 + GG</option>
    <option value="OVER 3.5 + GG">OVER 3.5 + GG</option>
  </select>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Date</th>
<th>Match</th>
<th>Market</th>
<th>Score</th>
<th>Result</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>
</div>

</div>

<script>
const DATA_URL = './history.json';

let data = [];

function esc(value){
  return String(value ?? '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

function resultIcon(status){
  if(status === 'WIN') return '<span class="win">✓</span>';
  if(status === 'LOSS') return '<span class="loss">✕</span>';
  return '<span class="pending">⏳</span>';
}

function kickoff(item){
  return item.kickoff || item.time || item.event_date || item.start_time || '';
}

function render(){

  const statusFilter = document.getElementById('status').value;
  const marketFilter = document.getElementById('market').value;

  const filtered = data.filter(item => {
    const statusOk =
      statusFilter === 'ALL' ||
      String(item.status || '').toUpperCase() === statusFilter;

    const marketOk =
      marketFilter === 'ALL' ||
      String(item.market || '') === marketFilter;

    return statusOk && marketOk;
  });

  filtered.sort((a,b) => {
    const da = new Date(kickoff(a)).getTime();
    const db = new Date(kickoff(b)).getTime();

    if(Number.isNaN(da) && Number.isNaN(db)) return 0;
    if(Number.isNaN(da)) return 1;
    if(Number.isNaN(db)) return -1;

    return da - db;
  });

  const rows = document.getElementById('rows');

  if(!filtered.length){
    rows.innerHTML =
      '<tr><td colspan="5" class="empty">No history found.</td></tr>';
    return;
  }

  rows.innerHTML = filtered.map(item => {

    const home = item.home || item.home_team || '';
    const away = item.away || item.away_team || '';
    const match =
      item.match ||
      (home && away ? `${home} 🆚 ${away}` : '');

    const score =
      item.home_score != null && item.away_score != null
        ? `${item.home_score} - ${item.away_score}`
        : '—';

    return `
      <tr>
        <td>${esc(kickoff(item))}</td>
        <td>${esc(match)}</td>
        <td>${esc(item.market || '—')}</td>
        <td>${esc(score)}</td>
        <td>${resultIcon(String(item.status || '').toUpperCase())}</td>
      </tr>
    `;
  }).join('');
}

function updateStats(){

  const total = data.length;

  const wins = data.filter(
    x => String(x.status || '').toUpperCase() === 'WIN'
  ).length;

  const losses = data.filter(
    x => String(x.status || '').toUpperCase() === 'LOSS'
  ).length;

  const pending = data.filter(
    x => String(x.status || '').toUpperCase() === 'PENDING'
  ).length;

  const settled = wins + losses;

  const rate = settled
    ? ((wins / settled) * 100).toFixed(1)
    : '0';

  document.getElementById('total').textContent = total;
  document.getElementById('wins').textContent = wins;
  document.getElementById('losses').textContent = losses;
  document.getElementById('pending').textContent = pending;
  document.getElementById('rate').textContent = rate + '%';
}

async function load(){

  try{

    const response = await fetch(DATA_URL + '?t=' + Date.now());

    if(!response.ok){
      throw new Error('History unavailable');
    }

    const json = await response.json();

    data = Array.isArray(json)
      ? json
      : [];

    updateStats();
    render();

  }catch(error){

    document.getElementById('rows').innerHTML =
      '<tr><td colspan="5" class="empty">Unable to load history.</td></tr>';

  }
}

document.getElementById('status').addEventListener('change', render);
document.getElementById('market').addEventListener('change', render);

load();
</script>

</body>
</html>
