name: Update Football Tips History

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-tips-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FootballTips
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Update history
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
        run: python update_history.py

      - name: Save history
        run: |
          git config user.name "football-tips-bot"
          git config user.email "actions@github.com"

          git add docs/history.json

          if git diff --cached --quiet; then
            echo "No history changes"
            exit 0
          fi

          git commit -m "Update tips history"
          git pull --rebase origin main
          git push
