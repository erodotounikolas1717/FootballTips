name: Football Tips Scanner

on:
  workflow_dispatch:
  schedule:
      - cron: '0 9 * * *'
        timezone: 'Europe/Nicosia'
      - cron: '0 17 * * *'
        timezone: 'Europe/Nicosia'

permissions:
  contents: write

concurrency:
  group: football-tips-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FootballTips
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test API-Football
        run: |
          python - <<'PY'
          import os
          import urllib.request
          import json

          key = os.environ["API_FOOTBALL_KEY"]

          req = urllib.request.Request(
              "https://v3.football.api-sports.io/leagues",
              headers={
                  "x-apisports-key": key,
                  "User-Agent": "FootballTips/1.0"
              }
          )

          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.loads(r.read().decode())

          print("API-FOOTBALL TEST OK")
          print("Leagues returned:", len(data.get("response", [])))
          PY
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - name: Run scanner
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '1560838491'
          BROADCAST_SECRET: ${{ secrets.BROADCAST_SECRET }}
          ACCESS_WORKER_URL: 'https://footballtips-access.erodotounikolas.workers.dev'
        run: python scanner.py
      - name: Commit history
        run: |
          git config user.name "football-tips-bot"
          git config user.email "actions@github.com"
          git add docs/history.json
          git diff --cached --quiet || git commit -m "Add new tips to history"
          git push
