name: Football Tips Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
      timezone: 'Europe/Nicosia'
    - cron: '0 17 * * *'
      timezone: 'Europe/Nicosia'

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FootballTips
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Football Tips Scanner
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '1560838491'
        run: python scanner.py
